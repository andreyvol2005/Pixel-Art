<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pixel Battle Online</title>
    <link rel="icon" type="image/png" href="/static/favicon.png">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>Выберите цвет:</h1>
        <div class="palette" id="palette"></div>
        <input type="color" id="customColor" value="#ff0000">
        <span class="tool-label">Пипетка:</span>
        <button id="eyedropperBtn" class="tool-btn" title="Пипетка — взять цвет с холста">
        💧
        </button>
        <label class="borders-toggle" title="Показывать границы клеток">
            <span class="toggle-label">Границы:</span>
            <input type="checkbox" id="bordersToggle" checked>
            <span class="toggle-slider"></span>
        </label>
        <a href="https://t.me/AndrikckLife" target="_blank" rel="noopener" class="tg-link">ТГ канал автора сайта</a>
        <span id="online"><span id="onlineCount">0</span> онлайн</span>
        <span id="status">соединение…</span>
    </header>

    <!-- Новая структура для зума и пана -->
    <main class="viewport" id="viewport">
        <div class="canvas-container" id="canvasContainer">
            <div id="canvas" class="canvas"></div>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
