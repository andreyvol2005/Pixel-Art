services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/pixelcanvas
      REDIS_URL: redis://redis:6379
      # Задайте длинную случайную строку, чтобы включить POST /api/admin/wipe
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - appdata:/app/data

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pixelcanvas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: postgres -c shared_buffers=128MB -c work_mem=8MB -c max_connections=20
    shm_size: 128mb
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  appdata: